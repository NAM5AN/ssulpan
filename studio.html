<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>채널 제작실 · 썰판</title><link rel="stylesheet" href="./styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="studio-page"><main class="studio"><header class="studio-top"><a class="brand" href="./">썰판</a><b>채널 제작실</b><small id="serverStatus">연결 확인 중</small></header><section id="authPanel" class="panel"><div class="login-box"><b>관리자 로그인</b><p class="status">체험단매니저와 같은 Supabase 관리자 계정을 사용합니다.</p><div class="login-row"><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="login" class="btn primary">로그인</button></div><div class="actions"><span id="authStatus" class="status"></span><button id="logout" class="btn hidden">로그아웃</button></div></div></section><div id="workspace" class="hidden"><section class="panel"><div class="two"><div class="field"><label>이야기 선택</label><select id="storySelect"></select></div><div class="field"><label>&nbsp;</label><button id="newDraft" class="btn">새 원고</button></div><div class="field full"><label>제목</label><input id="title"></div><div class="field"><label>카테고리</label><select id="category"><option>직장생활</option><option>인간관계</option><option>일상</option></select></div><div class="field"><label>짧은 소개</label><input id="teaser"></div><div class="field full"><label>소재 내용</label><textarea id="sourceText" placeholder="원문을 붙여넣거나 사건의 핵심을 적어 주세요."></textarea></div><div class="field full"><label>작성 요청</label><textarea id="notes" placeholder="예: 신입이 건넨 말에서 시작하고, 대화가 자연스럽게 이어지게"></textarea></div><div class="field full"><label>소재 이미지</label><input id="sourceImages" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="imageList" class="actions"></div></div></div></section><section class="panel"><h2>AI 생성</h2><div class="two"><div class="field"><label>엔진</label><select id="provider"><option value="claude">Claude</option><option value="openai">GPT</option></select></div><div class="field"><label>모델 ID</label><input id="model" value="claude-sonnet-4-6"></div><div class="field"><label>말투</label><select id="tone"><option>친구에게 말하듯</option><option>담담하게</option><option>음슴체</option></select></div><div class="field"><label>목표 분량</label><select id="length"><option value="1500">약 1,500자</option><option value="2000" selected>약 2,000자</option><option value="3000">약 3,000자</option><option value="5000">약 5,000자</option></select></div><div class="field"><label>긴장감</label><select id="tension"><option>보통</option><option selected>높게</option><option>아주 높게</option></select></div><div class="field"><label>대화 비중</label><select id="dialogue"><option>적게</option><option selected>보통</option><option>많게</option></select></div></div><div class="actions"><button id="generate" class="btn primary">전체 원고 생성</button><button id="extractImages" class="btn">이미지 글 읽기</button><button id="generateSocial" class="btn">인스타 문구</button><span id="aiStatus" class="status"></span></div></section><section class="panel"><div class="field"><label>제목 후보</label><div id="titleCandidates" class="title-candidates"></div></div></section><section class="panel"><h2>미리 보여줄 내용</h2><div class="field"><textarea id="beforeContent" class="manuscript"></textarea><span id="beforeCount" class="counts">0자</span></div><div class="actions"><button data-rewrite="beforeContent" class="btn">이 부분 다시 쓰기</button></div></section><section class="panel"><h2>광고 후 보여줄 내용</h2><div class="field"><textarea id="afterContent" class="manuscript"></textarea><span id="afterCount" class="counts">0자</span></div><div class="actions"><button data-rewrite="afterContent" class="btn">이 부분 다시 쓰기</button></div></section><section class="panel"><div class="field"><label>다시 쓸 때 반영할 요청</label><textarea id="rewriteInstruction"></textarea></div><div class="actions"><button id="review" class="btn">앞뒤 내용 점검</button><button id="split" class="btn">끊을 위치 추천</button><button id="copyAll" class="btn">전체 본문 복사</button></div><pre id="reviewResult" class="review hidden"></pre><div class="field"><label>인물·사건 메모</label><textarea id="storyBible"></textarea></div><div class="field"><label>이어 읽기 문구</label><input id="gateLine"></div></section><section class="panel"><h2>인스타 원고</h2><div class="field"><label>표지 제목</label><textarea id="hook"></textarea></div><div class="field"><label>하단 짧은 문장</label><input id="coverDetail"></div><div class="field"><label>캡션</label><textarea id="caption"></textarea></div><div class="field"><label>해시태그</label><input id="hashtags"></div><div class="actions"><button id="openInstagram" class="btn">1080×1920 표지 보기</button><button id="openManuscript" class="btn">장별 원고 5장</button></div></section><section class="panel"><div class="actions"><button id="saveDraft" class="btn">원고 저장</button><button id="publish" class="btn primary">사이트에 게시</button><button id="viewPublished" class="btn">게시된 글 보기</button><span id="saveStatus" class="status"></span></div></section><details class="panel"><summary>작업 기록</summary><div id="jobs" class="review">불러오는 중…</div></details></div></main><script src="./config.js"></script><script src="./data.js"></script><script src="./studio.js" defer></script></body></html>
