<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>채널 제작실 · 썰판</title><meta name="theme-color" content="#fd582b"><link rel="icon" href="/favicon.png"><link rel="stylesheet" href="/studio.css"></head><body class="studio-page"><main class="studio-shell">
<header class="studio-head"><a class="studio-brand" href="/"><img src="/brand/ssulpan-logo.png" alt="썰판"></a><div><h1>채널 제작실</h1><p>소재 입력 → Claude 편집 → 확인 후 반영 → 게시</p></div><span id="status" class="status"></span></header>
<details id="connection-panel" class="panel hidden"><summary>클로드 연결</summary><div class="studio-grid"><label class="field"><span>API 키</span><input id="claude-key" type="password" autocomplete="off"></label><label class="field"><span>모델 ID</span><input id="claude-model" value="claude-sonnet-4-6"></label></div><div class="actions"><button id="connect-claude">연결</button><span id="connection-status"></span></div><div id="connection-result"></div></details>
<section class="panel story-picker"><h2>이야기 선택</h2><div class="picker-row"><select id="story-select" aria-label="이야기 선택"></select><button id="new-story" class="btn">새 원고</button></div></section>
<section class="panel"><div class="panel-title-row"><div><span class="eyebrow">원고 편집</span><h2 id="workspace-title">새 원고</h2></div><p id="draft-status" class="micro"></p></div><div class="studio-grid"><label class="field full"><span>제목</span><input id="story-title" maxlength="160"></label><label class="field"><span>카테고리</span><select id="category"><option>직장생활</option><option>인간관계</option><option>일상</option></select></label><label class="field"><span>짧은 소개</span><input id="teaser" maxlength="240"></label><label class="field full"><span>소재 주소</span><div class="inline-input"><input id="source-url" placeholder="지원되는 커뮤니티 글 주소"><button id="read-source" class="btn">주소에서 본문 읽기</button></div></label><label class="field full"><span>소재 내용</span><textarea id="source-text" placeholder="원문을 붙여넣거나 사건의 핵심을 적어 주세요."></textarea></label><label class="field full"><span>소재 이미지</span><input id="source-images" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="image-list" class="image-list"></div></label></div></section>
<section class="panel"><h2>작성 요청</h2><label class="field full"><textarea id="writing-notes" placeholder="예: 신입이 건넨 말에서 시작하고, 대화가 자연스럽게 이어졌으면 좋겠어."></textarea></label><div class="studio-grid compact-grid"><label class="field"><span>말투</span><select id="tone"><option>친구에게 말하듯</option><option>담담하게</option><option>음슴체</option></select></label><label class="field"><span>긴장감</span><select id="tension"><option>보통</option><option selected>높게</option><option>아주 높게</option></select></label><label class="field"><span>대화 비중</span><select id="dialogue"><option>적게</option><option selected>보통</option><option>많게</option></select></label></div><div class="actions"><button id="generate-story" class="btn primary">클로드로 원고 만들기</button><button id="generate-prompt" class="btn">작성 지침 생성</button><span id="work-status" class="status"></span></div><p class="micro">한 이야기로 작성한 뒤 광고 전·후로 나눠 보여줍니다. Claude 결과는 바로 덮어쓰지 않고 아래에서 확인한 뒤 반영합니다.</p></section>
<details class="panel"><summary>작성 지침</summary><label class="field full"><textarea id="writing-prompt"></textarea></label><div class="actions"><button id="save-prompt" class="btn">지침 저장</button><button id="reload-prompt" class="btn">다시 불러오기</button></div><p id="prompt-status" class="micro"></p><p id="generation-calls" class="micro"></p></details>
<section class="panel"><div class="section-heading"><h2>미리 보여줄 내용</h2><span id="before-count" class="counts">0자</span></div><textarea id="before-content" class="manuscript"></textarea><div class="actions"><button data-copy="before-content" class="btn">내용 복사</button><button data-rewrite="before" class="btn">이 부분 다시 쓰기</button></div></section>
<section class="panel"><div class="section-heading"><h2>광고 후 보여줄 내용</h2><span id="after-count" class="counts">0자</span></div><textarea id="after-content" class="manuscript"></textarea><div class="actions"><button data-copy="after-content" class="btn">내용 복사</button><button data-rewrite="after" class="btn">이 부분 다시 쓰기</button></div></section>
<section class="panel"><label class="field full"><span>다시 쓸 때 반영할 요청</span><textarea id="rewrite-instruction" placeholder="예: 대사를 줄이고 마지막 두 문장을 더 긴장감 있게"></textarea></label><p class="micro">전체 원고를 참고하면서 선택한 구간만 수정합니다.</p><div class="actions triple"><button id="review-story" class="btn">앞뒤 내용 점검</button><button id="split-story" class="btn">끊을 위치 추천</button><button id="copy-body" class="btn">전체 본문 복사</button></div><details class="memo"><summary>인물·사건 메모</summary><label class="field full"><textarea id="story-bible"></textarea></label></details><label class="field full"><span>이어 읽기 문구</span><input id="gate-line" maxlength="100"></label><label class="field full range-field"><span>그라데이션 길이 <output id="fade-value">180px</output></span><input id="fade-height" type="range" min="80" max="300" value="180"><div class="range-labels"><span>짧게</span><span>길게</span></div></label></section>
<section class="panel"><h2>본문 미리보기</h2><div class="actions"><button id="preview-before" class="btn">앞부분</button><button id="preview-after" class="btn">뒷부분</button></div><iframe id="reader-preview" title="본문 미리보기"></iframe></section>
<section class="panel"><h2>인스타 원고</h2><div class="studio-grid"><label class="field full"><span>표지 제목</span><textarea id="hook"></textarea></label><label class="field full"><span>하단 짧은 문장</span><input id="cover-detail" maxlength="100"></label><label class="field full"><span>캡션</span><textarea id="caption"></textarea></label><label class="field full"><span>해시태그</span><input id="hashtags"></label></div><div class="actions"><button id="generate-social" class="btn">인스타 문구 생성</button><button id="copy-caption" class="btn">캡션 복사</button></div><div class="cover-wrap"><canvas id="cover-canvas" width="1080" height="1920"></canvas><div><p id="cover-status" class="micro"></p><button id="download-cover" class="btn">1080×1920 PNG 저장</button></div></div></section>
<section id="proposal" class="panel proposal" hidden><span class="eyebrow">Claude 결과</span><h2 id="proposal-title">결과</h2><p id="proposal-note" class="micro"></p><div id="proposal-titles" class="actions"></div><textarea id="proposal-text" readonly></textarea><div class="actions"><button id="apply-proposal" class="btn primary">원고에 반영</button><button id="close-proposal" class="btn">닫기</button></div></section>
<details id="history-panel" class="panel"><summary>작업 기록 · 버전</summary><div class="actions"><button id="refresh-history" class="btn">새로고침</button></div><h3>Claude 작업</h3><div id="job-list"></div><h3>저장 버전</h3><div id="version-list"></div></details>
<section class="panel publish-panel"><div class="actions"><button id="extract-images" class="btn">이미지 글 읽기</button><button id="export-draft" class="btn">원고 내보내기</button><button id="save-draft" class="btn">원고 저장</button><button id="publish-story" class="btn primary">사이트에 게시</button><a id="open-reader" class="btn" href="/" hidden>게시된 글 보기</a></div><p id="publication-note" class="micro"></p><input id="article-url" readonly><textarea id="copy-fallback" class="copy-fallback" hidden></textarea></section>
</main><script src="/cover.js"></script><script src="/studio.js"></script></body></html>
