name: Inspect recovered original UI
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/inspect-original-ui.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Summarize captured resources
        run: |
          python3 - <<'PY'
          import json,pathlib,re
          root=pathlib.Path('recovered/sseolzip/live-ui-snapshot')
          m=json.loads((root/'capture-manifest.json').read_text())
          for r in m['resources']:
              if 'path' in r and not '__q_' in r['path']: print(r['path'],r['bytes'],r['sha256'])
              elif 'error' in r: print('UNAVAILABLE',r['url'],r['error'])
          for file in ('index.html','stories/001/index.html'):
              text=(root/file).read_text()
              print('\nSCRIPTS',file)
              for script in re.findall(r'<script\b[^>]*>.*?</script>',text,re.S): print(script)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssulpan-original-ui
          path: |
            recovered/sseolzip/live-ui-snapshot/
          retention-days: 3
          if-no-files-found: error
