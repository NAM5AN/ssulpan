name: Export source for original UI migration
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/export-migration-source.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Package tracked source only, excluding credentials and font files
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile('/tmp/ssulpan-migration-source.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for name in paths:
                  p = pathlib.Path(name)
                  if not name or not p.is_file() or p.is_symlink(): continue
                  if p.suffix.lower() in {'.woff','.woff2','.otf','.ttf','.eot','.pem','.key'} or p.name.startswith('.env'): continue
                  z.write(p, name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssulpan-migration-source
          path: /tmp/ssulpan-migration-source.zip
          retention-days: 3
          if-no-files-found: error
