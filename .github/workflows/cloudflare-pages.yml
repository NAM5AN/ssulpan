name: Deploy ssulpan to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build from original UI, with source hash checks
        run: |
          python3 scripts/build-original.py
          cp studio.css dist/studio.css
          cp recovered/sseolzip/implementation-review/baseline/public/studio.js dist/studio.js
          node --check dist/studio.js
          grep -q 'id="story-select"' dist/studio.html
          ! grep -q '관리자 로그인' dist/studio.html

      - name: Verify original UI, full stories and backend adapter
        run: node --test tests/original-ui.test.mjs

      - name: Discover Cloudflare account automatically
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN repository secret is missing." >&2
            exit 1
          fi
          RESPONSE="$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=50")"
          ACCOUNT_ID="$(python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or []; print(r[0].get("id", "") if len(r)==1 else "")' <<<"$RESPONSE")"
          ACCOUNT_COUNT="$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(len(d.get("result") or []))' <<<"$RESPONSE")"
          if [ "$ACCOUNT_COUNT" != "1" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "The token must be scoped to exactly one Cloudflare account. Found: $ACCOUNT_COUNT" >&2
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "Cloudflare account detected automatically."

      - name: Deploy to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.131.0 pages deploy dist \
            --project-name=ssulpan \
            --branch=main \
            --commit-hash="$GITHUB_SHA"

      - name: Verify deployed original assets and all public routes
        continue-on-error: true
        run: python3 scripts/verify-live.py

      - name: Publish verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-ui-verification
          path: |
            dist/ui-provenance.json
            live-verification.json
          if-no-files-found: warn
          retention-days: 7
