name: Recover original sseolzip UI snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-original-ui.yml'

permissions:
  contents: write

concurrency:
  group: recover-original-ui
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Fetch original public HTML and linked resources without changing their content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections, datetime, hashlib, html, json, os, pathlib, re, urllib.error, urllib.parse, urllib.request
          origin='https://sseolzip.tnwjd2854.chatgpt.site'
          root=pathlib.Path('recovered/sseolzip/live-ui-snapshot')
          root.mkdir(parents=True, exist_ok=True)
          headers={'User-Agent':'Mozilla/5.0 (compatible; SsulpanMigration/1.0)', 'Accept':'*/*'}
          queue=collections.deque([origin+'/', origin+'/studio/'])
          seen=set(); records=[]; root_ok=False
          fonts={'.woff','.woff2','.ttf','.otf','.eot'}
          assets={'.css','.js','.mjs','.svg','.png','.jpg','.jpeg','.webp','.gif','.ico','.avif','.json'}
          def resolve(raw, base):
              u=urllib.parse.urlsplit(urllib.parse.urljoin(base, html.unescape(raw)))
              if u.scheme!='https' or u.netloc!=urllib.parse.urlsplit(origin).netloc: return None
              if any(part in ('..','api','auth','logout','signout') for part in u.path.split('/')): return None
              if pathlib.PurePosixPath(u.path).suffix.lower() in fonts: return None
              return urllib.parse.urlunsplit((u.scheme,u.netloc,u.path,u.query,''))
          while queue and len(seen)<100:
              url=queue.popleft()
              if url in seen: continue
              seen.add(url)
              path=urllib.parse.urlsplit(url).path
              record={'url':url}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=25) as r:
                      final=r.geturl(); mime=r.headers.get('content-type',''); data=r.read(12*1024*1024+1)
                      if urllib.parse.urlsplit(final).netloc!=urllib.parse.urlsplit(origin).netloc:
                          raise ValueError('redirected outside original site; no credentials or login pages are captured')
                      if len(data)>12*1024*1024: raise ValueError('resource too large')
                      record.update(status=r.status,contentType=mime,finalUrl=final)
              except Exception as e:
                  record['error']=str(e); records.append(record); print('UNAVAILABLE',url,str(e))
                  if path=='/' and not urllib.parse.urlsplit(url).query: raise SystemExit('Original homepage could not be fetched; nothing will be called recovered.')
                  continue
              rel=path.lstrip('/')
              if not rel or rel.endswith('/') or not pathlib.PurePosixPath(rel).suffix:
                  rel=rel.rstrip('/')+'/index.html' if rel else 'index.html'
              if urllib.parse.urlsplit(url).query:
                  p=pathlib.PurePosixPath(rel)
                  rel=str(p.with_name(p.stem+'__q_'+hashlib.sha256(urllib.parse.urlsplit(url).query.encode()).hexdigest()[:10]+p.suffix))
              dest=root/rel
              if root.resolve() not in dest.resolve().parents: raise ValueError('unsafe relative path')
              dest.parent.mkdir(parents=True,exist_ok=True); dest.write_bytes(data)
              record.update(path=rel,bytes=len(data),sha256=hashlib.sha256(data).hexdigest()); records.append(record)
              print('CAPTURED',rel,mime,len(data))
              if url==origin+'/':
                  text=data.decode('utf-8','replace')
                  if '썰판' not in text or '<html' not in text.lower(): raise SystemExit('The response is not the original story homepage.')
                  root_ok=True
              if not any(t in mime for t in ('html','css','javascript','json')): continue
              text=data.decode('utf-8','replace')
              candidates=re.findall(r'''(?:src|href|poster)\s*=\s*["']([^"']+)["']''',text,re.I)
              candidates+=re.findall(r'''url\(\s*["']?([^\s"')]+)''',text,re.I)
              candidates+=re.findall(r'''["'](/[^\s"'<>]+\.(?:css|js|mjs|svg|png|jpg|jpeg|webp|avif)(?:\?[^"']*)?)["']''',text,re.I)
              for raw in candidates:
                  target=resolve(raw,final)
                  if not target: continue
                  p=urllib.parse.urlsplit(target).path
                  # Capture UI documents and static assets only; no API calls or mutations.
                  if pathlib.PurePosixPath(p).suffix.lower() in assets or p.startswith(('/stories/','/studio/','/page/')) or p in ('/','/instagram/','/manuscript/'):
                      if target not in seen: queue.append(target)
          if not root_ok: raise SystemExit('No source UI recovered')
          manifest={'origin':origin,'capturedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'contentModified':False,'resources':records,'truncated':bool(queue)}
          (root/'capture-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print('CAPTURE COMPLETE:',sum('path' in r for r in records),'files;',sum('error' in r for r in records),'unavailable resources')
          PY
      - name: Commit original snapshot only (do not replace the running site)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered/sseolzip/live-ui-snapshot
          if ! git diff --cached --quiet; then
            git commit -m 'chore: preserve byte-exact original public UI and asset provenance'
            git push origin HEAD:main
          fi
