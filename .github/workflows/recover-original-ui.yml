name: Recover original sseolzip UI snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/recover-original-ui.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch original live site HTML and same-origin assets
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://sseolzip.tnwjd2854.chatgpt.site'
          OUT='recovered/sseolzip/live-ui-snapshot'
          rm -rf "$OUT"
          mkdir -p "$OUT"

          python3 - <<'PY'
          import os, re, urllib.parse, urllib.request
          origin='https://sseolzip.tnwjd2854.chatgpt.site'
          out='recovered/sseolzip/live-ui-snapshot'
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          headers={'User-Agent':ua,'Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'}
          seen=set()

          def fetch(url):
              req=urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.geturl(), r.headers.get('content-type',''), r.read()

          def save(rel, data):
              path=os.path.join(out, rel.lstrip('/'))
              if path.endswith('/') or not os.path.splitext(path)[1]:
                  path=os.path.join(path,'index.html')
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path,'wb') as f: f.write(data)
              return path

          pages=['/','/studio/']
          for page in pages:
              try:
                  final,ctype,data=fetch(origin+page)
              except Exception as e:
                  print('PAGE_FETCH_ERROR',page,repr(e))
                  continue
              rel=urllib.parse.urlparse(final).path or '/'
              pagepath=save(rel,data)
              print('PAGE',page,'->',final,ctype,len(data),pagepath)
              text=data.decode('utf-8','replace')
              urls=set(re.findall(r'''(?:src|href)=["']([^"'#]+)''',text,re.I))
              for raw in sorted(urls):
                  absu=urllib.parse.urljoin(final,raw)
                  u=urllib.parse.urlparse(absu)
                  if u.scheme not in ('http','https') or u.netloc!=urllib.parse.urlparse(origin).netloc:
                      continue
                  key=u._replace(query='',fragment='').geturl()
                  if key in seen: continue
                  seen.add(key)
                  try:
                      afinal,actype,adata=fetch(absu)
                  except Exception as e:
                      print('ASSET_FETCH_ERROR',absu,repr(e))
                      continue
                  ap=urllib.parse.urlparse(afinal)
                  rel=ap.path or '/'
                  saved=save(rel,adata)
                  print('ASSET',absu,'->',afinal,actype,len(adata),saved)
          PY

          echo '--- recovered files ---'
          find "$OUT" -type f -printf '%p %s bytes\n' | sort

      - name: Commit recovered snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovered/sseolzip/live-ui-snapshot
          if git diff --cached --quiet; then
            echo 'No snapshot changes to commit.'
          else
            git commit -m 'chore: recover original live sseolzip UI snapshot'
            git push
          fi
