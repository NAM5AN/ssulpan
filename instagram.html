<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>인스타 표지 — 썰판</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="tool-page">
  <main class="tool-shell">
    <div class="tool-head"><a href="/" class="brand small">썰판</a><a id="backStudio" href="/studio.html">원고 편집</a></div>
    <h1>인스타 표지</h1>
    <p class="tool-dim">1080 × 1920</p>
    <div class="cover-stage">
      <div id="instaCover" class="insta-cover">
        <div class="cover-brand">썰판</div>
        <div class="cover-frame">
          <div id="coverCategory" class="cover-category"></div>
          <div id="coverHook" class="cover-hook"></div>
          <div id="coverDetail" class="cover-detail"></div>
        </div>
        <div class="cover-footer"><span>창작·각색 이야기</span><strong>전체 글은 프로필 링크</strong></div>
      </div>
    </div>
    <p class="tool-dim">9:16 세로형 · PNG 1080×1920</p>
    <div class="tool-actions"><button id="downloadCover" class="primary">PNG 저장</button><button id="copyCaption">캡션 복사</button></div>
    <section class="social-copy">
      <h2>인스타그램 캡션</h2>
      <p id="captionText"></p>
      <p id="hashtagText"></p>
    </section>
    <canvas id="coverCanvas" width="1080" height="1920" hidden></canvas>
  </main>
  <script src="/data.js"></script>
  <script src="/instagram.js" defer></script>
</body>
</html>
