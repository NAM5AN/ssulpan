<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>채널 제작실 · 썰판</title><link rel="stylesheet" href="/site.css"></head><body class="studio-page"><main class="studio-shell"><header class="studio-head"><a class="brand" href="/">썰판</a><h1>채널 제작실</h1><span id="status" class="status"></span></header>
<details id="connection-panel" class="panel"><summary>클로드 연결</summary><div class="studio-grid"><label class="field"><span>API 키</span><input id="claude-key" type="password" autocomplete="off"></label><label class="field"><span>모델 ID</span><input id="claude-model" value="claude-sonnet-5"></label></div><div class="actions"><button id="connect-claude" class="primary">연결</button><span id="connection-status"></span></div><div id="connection-result"></div></details>
<section class="panel"><label class="field full"><span>이야기 선택</span><select id="story-select" hidden></select></label><div class="actions"><button id="new-story">새 원고</button></div><h2 id="workspace-title">새 원고</h2><p id="draft-status"></p><div class="studio-grid"><label class="field"><span>제목</span><input id="story-title" maxlength="160"></label><label class="field"><span>카테고리</span><select id="category"><option>직장생활</option><option>인간관계</option><option>일상</option></select></label><label class="field full"><span>짧은 소개</span><input id="teaser" maxlength="240"></label><label class="field full"><span>소재 주소</span><div class="actions"><input id="source-url" style="flex:1"><button id="read-source">주소에서 본문 읽기</button></div></label><label class="field full"><span>소재 내용</span><textarea id="source-text"></textarea></label><label class="field full"><span>소재 이미지</span><input id="source-images" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="image-list" class="image-list"></div></label></div></section>
<section class="panel"><h2>작성 요청</h2><label class="field"><textarea id="writing-notes" placeholder="예: 신입이 건넨 말에서 시작하고, 대화가 자연스럽게 이어졌으면 좋겠어."></textarea></label><div class="studio-grid"><label class="field"><span>말투</span><select id="tone"><option>친구에게 말하듯</option><option>담담하게</option><option>음슴체</option></select></label><label class="field"><span>긴장감</span><select id="tension"><option>보통</option><option selected>높게</option><option>아주 높게</option></select></label><label class="field"><span>대화 비중</span><select id="dialogue"><option>적게</option><option selected>보통</option><option>많게</option></select></label></div><div class="actions"><button id="generate-story" class="primary">클로드로 원고 만들기</button><button id="generate-prompt">작성 지침 생성</button><span id="work-status"></span></div></section>
<details class="panel"><summary>작성 지침</summary><label class="field"><textarea id="writing-prompt"></textarea></label><div class="actions"><button id="save-prompt">지침 저장</button><button id="reload-prompt">다시 불러오기</button></div><p id="prompt-status"></p><p id="generation-calls"></p></details>
<section class="panel"><h2>미리 보여줄 내용</h2><textarea id="before-content" style="width:100%;min-height:360px"></textarea><p id="before-count" class="counts">0자</p><div class="actions"><button data-copy="before-content">내용 복사</button><button data-rewrite="before">이 부분 다시 쓰기</button></div></section>
<section class="panel"><h2>광고 후 보여줄 내용</h2><textarea id="after-content" style="width:100%;min-height:420px"></textarea><p id="after-count" class="counts">0자</p><div class="actions"><button data-copy="after-content">내용 복사</button><button data-rewrite="after">이 부분 다시 쓰기</button></div></section>
<section class="panel"><label class="field"><span>다시 쓸 때 반영할 요청</span><textarea id="rewrite-instruction"></textarea></label><div class="actions"><button id="review-story">앞뒤 내용 점검</button><button id="split-story">끊을 위치 추천</button><button id="copy-body">전체 본문 복사</button></div><label class="field"><span>인물·사건 메모</span><textarea id="story-bible"></textarea></label><label class="field"><span>이어 읽기 문구</span><input id="gate-line" maxlength="100"></label><label class="field"><span>그라데이션 길이 <output id="fade-value">180px</output></span><input id="fade-height" type="range" min="80" max="300" value="180"></label></section>
<section class="panel"><h2>본문 미리보기</h2><div class="actions"><button id="preview-before">앞부분</button><button id="preview-after">뒷부분</button></div><iframe id="reader-preview" title="본문 미리보기"></iframe></section>
<section class="panel"><h2>인스타 원고</h2><div class="studio-grid"><label class="field full"><span>표지 제목</span><textarea id="hook"></textarea></label><label class="field full"><span>하단 짧은 문장</span><input id="cover-detail" maxlength="100"></label><label class="field full"><span>캡션</span><textarea id="caption"></textarea></label><label class="field full"><span>해시태그</span><input id="hashtags"></label></div><div class="actions"><button id="generate-social">인스타 문구 생성</button><button id="copy-caption">캡션 복사</button></div><canvas id="cover-canvas" width="1080" height="1920"></canvas><p id="cover-status"></p><button id="download-cover">1080×1920 PNG 저장</button></section>
<section id="proposal" class="panel proposal" hidden><h2 id="proposal-title">결과</h2><p id="proposal-note"></p><div id="proposal-titles" class="actions"></div><textarea id="proposal-text"></textarea><div class="actions"><button id="apply-proposal" class="primary">원고에 반영</button><button id="close-proposal">닫기</button></div></section>
<details id="history-panel" class="panel"><summary>작업 기록·버전</summary><div class="actions"><button id="refresh-history">새로고침</button></div><div id="job-list"></div><div id="version-list"></div></details>
<section class="panel"><div class="actions"><button id="extract-images">이미지 글 읽기</button><button id="export-draft">원고 내보내기</button><button id="save-draft">원고 저장</button><button id="publish-story" class="primary">사이트에 게시</button><a id="open-reader" class="btn" href="/" hidden>게시된 글 보기</a></div><p id="publication-note"></p><input id="article-url" readonly style="width:100%"><button id="copy-fallback" hidden>복사</button></section></main><script src="/cover.js"></script><script src="/studio.js"></script></body></html>
